name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースする既存タグ（例: v1.0.0）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Check release version
        run: |
          uv run --locked python -c @'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          version = runpy.run_path('src/__version__.py')['__version__']
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match src/__version__.py'
          assert project['project']['version'] == version, 'pyproject.toml version must match src/__version__.py'
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Build installer
        run: .\build-installer.ps1

      - name: Test installation and upgrade
        run: |
          $installer = Get-Item dist\ncdl-*-windows-x64.msi
          .\tests\test_installer.ps1 -Installer $installer.FullName

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item dist\ncdl-*-windows-x64.msi
          gh release create $env:RELEASE_TAG $installer.FullName dist\ncdl.exe --verify-tag --generate-notes --title "ncdl $env:RELEASE_TAG"
